# Runner (Tauri 2) gate suite. Action pins reuse the SHAs recorded in
# docs/SECURITY-LEDGER.md; Rust comes from the runner image's rustup per
# https://docs.github.com/en/actions/reference/runners/github-hosted-runners
name: Runner CI

on:
  pull_request:
    paths: ["runner/**", ".github/workflows/runner-ci.yml"]
  push:
    branches: [main]
    paths: ["runner/**", ".github/workflows/runner-ci.yml"]

permissions:
  contents: read

concurrency:
  group: runner-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: runner
    steps:
      # Source: https://github.com/step-security/harden-runner (copied 2026-07-19)
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - run: npm ci --ignore-scripts
      - run: npm run check
