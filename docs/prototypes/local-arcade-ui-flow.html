<div id="localarcade-ui-flow">
  <div class="viz-controls" aria-label="Flow controls">
    <button type="button" class="btn btn-primary" data-product="website" aria-pressed="true">Website</button>
    <button type="button" class="btn" data-product="app" aria-pressed="false">Desktop app</button>
    <span aria-hidden="true">·</span>
    <button type="button" class="btn btn-ghost" data-journey="new" aria-pressed="true">New to local AI</button>
    <button type="button" class="btn btn-ghost" data-journey="existing" aria-pressed="false">Already runs models</button>
  </div>

  <p class="text-muted" id="flow-purpose"></p>

  <div class="flow" id="flow-nodes" role="group" aria-label="Screen flow"></div>

  <section class="card" id="screen-detail" aria-live="polite">
    <div class="detail-head">
      <div>
        <span class="viz-badge" id="screen-phase"></span>
        <h3 id="screen-name"></h3>
      </div>
      <span class="text-muted" id="screen-position"></span>
    </div>
    <p id="screen-job"></p>
    <div class="detail-grid">
      <div>
        <strong>User sees</strong>
        <ul id="screen-sees"></ul>
      </div>
      <div>
        <strong>Primary action</strong>
        <p id="screen-action"></p>
      </div>
      <div>
        <strong>Must not happen</strong>
        <p id="screen-guardrail"></p>
      </div>
    </div>
  </section>

  <div class="scope-line">
    <strong id="scope-label"></strong>
    <span class="text-muted" id="scope-copy"></span>
  </div>
</div>

<style>
  #local-arcade-ui-flow { color: var(--foreground); }
  #local-arcade-ui-flow .viz-controls { margin-bottom: 0.75rem; }
  #local-arcade-ui-flow .flow { display: flex; flex-wrap: wrap; align-items: center; gap: 0.55rem; margin: 1rem 0; }
  #local-arcade-ui-flow .flow-step { display: flex; align-items: center; gap: 0.55rem; }
  #local-arcade-ui-flow .flow-step:not(:last-child)::after { content: "→"; color: var(--muted-foreground); }
  #local-arcade-ui-flow .flow-node[aria-pressed="true"] { background: var(--primary); color: var(--primary-foreground); }
  #local-arcade-ui-flow .detail-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; }
  #local-arcade-ui-flow .detail-head h3 { margin-bottom: 0; }
  #local-arcade-ui-flow .detail-grid { display: grid; grid-template-columns: 1.25fr 1fr 1fr; gap: 1rem; margin-top: 1rem; }
  #local-arcade-ui-flow .detail-grid strong { display: block; margin-bottom: 0.4rem; }
  #local-arcade-ui-flow .detail-grid p { margin: 0; }
  #local-arcade-ui-flow .detail-grid ul { margin: 0; padding-left: 1.2rem; }
  #local-arcade-ui-flow .scope-line { display: flex; gap: 0.65rem; align-items: baseline; margin-top: 1rem; }
  @media (max-width: 640px) {
    #local-arcade-ui-flow .detail-grid { grid-template-columns: 1fr; }
    #local-arcade-ui-flow .detail-head, #local-arcade-ui-flow .scope-line { flex-direction: column; }
  }
</style>

<script>
(() => {
  const root = document.getElementById("localarcade-ui-flow");
  const flows = {
    website: {
      purpose: "The website answers before anything is installed: what should I run, and why should I trust that answer?",
      scope: "Core website release",
      scopeCopy: "Finder, results, configuration detail, and a setup handoff. Hardware-shopping is designed next, after current price data is trustworthy.",
      new: [
        { name: "Finder", phase: "DECIDE", job: "Tell Local Arcade what computer I have and what I want to do without knowing model jargon.", sees: ["One question: what are you trying to do?", "Recognizable hardware choices with an “I don’t know” route", "Plain-language patience and privacy/offline needs"], action: "Show configurations", guardrail: "No benchmark controls, endpoint URLs, manifests, or unexplained context-token fields." },
        { name: "Recommendations", phase: "CHOOSE", job: "See a small number of genuinely different options and understand the tradeoff.", sees: ["Best supported choice", "Faster alternative", "Higher-quality alternative", "Clear “we do not have enough evidence” state"], action: "Inspect one setup", guardrail: "Never pad the page with five variants of one model or turn compatibility into a quality rank." },
        { name: "Configuration", phase: "UNDERSTAND", job: "Know exactly what to install and what experience to expect.", sees: ["Model artifact and quantization", "App/runtime route", "Context chosen from the task", "Expected fit/speed range with source and confidence"], action: "Use this setup", guardrail: "Do not expose every runtime flag in the main view or imply estimates came from this machine." },
        { name: "Setup handoff", phase: "ACT", job: "Move from a recommendation to a safe next action.", sees: ["Open in desktop app when installed", "Otherwise, a product-specific setup guide", "Download size, source, hash, and supported route"], action: "Open app or follow guide", guardrail: "The website never scans, downloads, or claims it changed the computer." }
      ],
      existing: [
        { name: "Finder", phase: "DECIDE", job: "Describe my exact hardware and intended harness quickly.", sees: ["Exact GPU/SoC and memory", "Task plus where it runs: chat, IDE agent, RAG, or API", "Advanced context/runtime preferences kept optional"], action: "Show configurations", guardrail: "Do not make experts repeat a novice tutorial or assume a runtime from a GGUF filename." },
        { name: "Recommendations", phase: "CHOOSE", job: "Find configurations worth testing, not a generic model leaderboard.", sees: ["Complete configuration identities", "Evidence matched to hardware, task, and harness", "Unknowns and coverage gaps"], action: "Compare candidates", guardrail: "No global score and no hidden blending of unrelated benchmarks." },
        { name: "Compare", phase: "COMPARE", job: "Compare two or three configurations on the dimensions that can actually change my decision.", sees: ["Fit headroom", "Generation and prompt speed separately", "Context and harness support", "Evidence scope and recency"], action: "Choose a candidate", guardrail: "Do not compare metrics collected under incompatible runtime or hardware conditions as peers." },
        { name: "Configuration", phase: "UNDERSTAND", job: "Inspect exact flags, build, artifact, and evidence before I try it.", sees: ["Expandable full identity", "Sources and raw measurement scope", "Known failure modes"], action: "Open in desktop app", guardrail: "No “best” claim beyond the selected task, harness, hardware, and evidence." }
      ]
    },
    app: {
      purpose: "The desktop app turns recommendations into personal evidence: what do I own, what works here, and what should I change next?",
      scope: "Core desktop release",
      scopeCopy: "Welcome/consent, home, model library, guided verification, results, and comparison. Sharing is separate and opt-in after value is delivered.",
      new: [
        { name: "Welcome", phase: "START", job: "Understand what the app does before granting access.", sees: ["Three promises: recommend, test, compare", "Nothing scanned yet", "Continue manually or inspect this computer"], action: "Inspect this computer", guardrail: "No auto-scan, account wall, transcript access, telemetry prompt, or technical dashboard." },
        { name: "Scan consent", phase: "PERMISSION", job: "Choose exactly what Local Arcade may inspect.", sees: ["Hardware detection", "Optional model-folder scan", "What is read and what never leaves the device"], action: "Scan selected items", guardrail: "Hardware permission does not imply model-folder permission; neither implies uploads." },
        { name: "Home", phase: "ORIENT", job: "Get one clear useful next step.", sees: ["Your computer in plain language", "Whether models were found", "One recommended next action", "Recent result only if one exists"], action: "Set up or test the first candidate", guardrail: "No empty analytics dashboard, unexplained “incumbent,” raw logs, or eight equal-priority cards." },
        { name: "Guided setup", phase: "SET UP", job: "Install one supported configuration without learning the whole ecosystem first.", sees: ["Why this choice", "Size and disk/memory requirement", "Chosen app/runtime", "Every action before it happens"], action: "Install and test", guardrail: "No silent engine install, model download, or fallback to a different quantization." },
        { name: "Verification", phase: "MEASURE", job: "See that the recommended setup actually works on this computer.", sees: ["Short preflight", "Visible model and exact settings", "Progress through load, speed, stability, and task checks"], action: "Finish test", guardrail: "Do not present a successful launch as proof it is the best model or a task check as general intelligence." },
        { name: "Personal result", phase: "DECIDE", job: "Know whether to keep this setup and what the next meaningful choice is.", sees: ["Works here / does not work here", "Observed responsiveness in human terms", "Known limitations", "Keep it, try an alternative, or stop"], action: "Keep setup", guardrail: "No purchase advice or model upgrade claim without a comparable alternative." }
      ],
      existing: [
        { name: "Welcome", phase: "START", job: "Get to my existing setup without a beginner funnel.", sees: ["Scan existing models", "Manual mode", "Exact local-only boundary"], action: "Scan my setup", guardrail: "No forced account, model download, or product tour." },
        { name: "Scan consent", phase: "PERMISSION", job: "Select stores and folders without exposing unrelated files.", sees: ["Detected Ollama/LM Studio locations", "Add a GGUF folder", "Per-source permission and read-only promise"], action: "Build local inventory", guardrail: "Never read chats, IDE history, prompts, or arbitrary folders." },
        { name: "Home", phase: "ORIENT", job: "See whether my current setup is known and what evidence is missing.", sees: ["Installed configurations", "Verified versus untested", "One next test chosen for information value"], action: "Test suggested configuration", guardrail: "No fake recommendation when the exact artifact or runtime identity is unknown." },
        { name: "Model library", phase: "INVENTORY", job: "Understand what is installed across products and where duplicates exist.", sees: ["One row per artifact", "Locations and supported run routes", "Identity confidence and last result"], action: "Select models to compare", guardrail: "Do not execute scanned artifacts or call every detected file a valid model." },
        { name: "Compare setup", phase: "DESIGN TEST", job: "Choose what question the comparison should answer.", sees: ["Model vs model, settings vs settings, or runtime vs runtime", "Task/harness selection", "Pinned controls that stay equal"], action: "Run comparison", guardrail: "No kitchen-sink benchmark and no comparison where multiple uncontrolled variables make the result meaningless." },
        { name: "Verification result", phase: "MEASURE", job: "Inspect personal fit, speed, stability, and task-check evidence.", sees: ["Side-by-side observed results", "Failures retained as evidence", "Exact identities and conditions"], action: "Record preference or rerun", guardrail: "Do not collapse quality, speed, and preference into one magic score." },
        { name: "Personal plan", phase: "IMPROVE", job: "Choose the smallest useful next change.", sees: ["Keep current setup", "Free settings change", "Different installed model", "New download or hardware only when evidence supports it"], action: "Apply one chosen change", guardrail: "No automatic routing, download, purchase, or data contribution without a separate explicit choice." }
      ]
    }
  };

  let product = "website";
  let journey = "new";
  let selected = 0;

  const purpose = root.querySelector("#flow-purpose");
  const nodes = root.querySelector("#flow-nodes");
  const phase = root.querySelector("#screen-phase");
  const name = root.querySelector("#screen-name");
  const position = root.querySelector("#screen-position");
  const job = root.querySelector("#screen-job");
  const sees = root.querySelector("#screen-sees");
  const action = root.querySelector("#screen-action");
  const guardrail = root.querySelector("#screen-guardrail");
  const scopeLabel = root.querySelector("#scope-label");
  const scopeCopy = root.querySelector("#scope-copy");

  function render() {
    const config = flows[product];
    const screens = config[journey];
    if (selected >= screens.length) selected = 0;
    purpose.textContent = config.purpose;
    scopeLabel.textContent = config.scope;
    scopeCopy.textContent = config.scopeCopy;
    nodes.replaceChildren(...screens.map((screen, index) => {
      const wrapper = document.createElement("span");
      wrapper.className = "flow-step";
      const button = document.createElement("button");
      button.type = "button";
      button.className = "btn flow-node";
      button.textContent = screen.name;
      button.setAttribute("aria-pressed", String(index === selected));
      button.addEventListener("click", () => { selected = index; render(); });
      wrapper.appendChild(button);
      return wrapper;
    }));
    const screen = screens[selected];
    phase.textContent = screen.phase;
    name.textContent = screen.name;
    position.textContent = `Screen ${selected + 1} of ${screens.length}`;
    job.textContent = screen.job;
    sees.replaceChildren(...screen.sees.map((text) => {
      const item = document.createElement("li");
      item.textContent = text;
      return item;
    }));
    action.textContent = screen.action;
    guardrail.textContent = screen.guardrail;
  }

  root.querySelectorAll("[data-product]").forEach((button) => button.addEventListener("click", () => {
    product = button.dataset.product;
    selected = 0;
    root.querySelectorAll("[data-product]").forEach((peer) => {
      const active = peer === button;
      peer.setAttribute("aria-pressed", String(active));
      peer.classList.toggle("btn-primary", active);
    });
    render();
  }));

  root.querySelectorAll("[data-journey]").forEach((button) => button.addEventListener("click", () => {
    journey = button.dataset.journey;
    selected = 0;
    root.querySelectorAll("[data-journey]").forEach((peer) => peer.setAttribute("aria-pressed", String(peer === button)));
    render();
  }));

  render();
})();
</script>
