[package]
name = "runner"
version = "0.1.0"
description = "Local Arcade Runner — desktop companion for hardware-truth benchmarks"
authors = ["Local Arcade"]
edition = "2021"

# R1 surface rule: no HTTP client, no sockets, no updater. The runtime makes
# zero network calls; tests/runner-boundary.test.mjs greps this manifest.

[lib]
name = "runner_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
